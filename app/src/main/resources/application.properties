server.port=8080
spring.application.name=orders
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders?currentSchema=shop}
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD:orders}
spring.datasource.hikari.pool-name=orders-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
