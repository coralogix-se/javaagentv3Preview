# Standalone legacy agent. Exports directly to Coralogix. v3 preview is off.
# Rendered by deploy.sh (CX_DOMAIN, CX_APP_NAME). Do not kubectl apply the raw placeholders.
apiVersion: v1
kind: Service
metadata:
  name: orders-legacy
  namespace: otel-java-v3
spec:
  selector:
    app: orders-legacy
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-legacy
  namespace: otel-java-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-legacy
  template:
    metadata:
      labels:
        app: orders-legacy
    spec:
      containers:
        - name: orders
          image: otel-java-orders:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/orders?currentSchema=shop
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coralogix
                  key: PRIVATE_KEY
            - name: OTEL_SERVICE_NAME
              value: orders-legacy
            - name: OTEL_SERVICE_VERSION
              value: "2.32.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=otel-java-v3,cx.application.name=${CX_APP_NAME},cx.subsystem.name=legacy,application.name=${CX_APP_NAME},api.name=legacy,k8s.namespace.name=otel-java-v3,k8s.deployment.name=orders-legacy,k8s.pod.name=$(POD_NAME)
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://ingress.${CX_DOMAIN}:443
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: Authorization=Bearer $(CX_API_KEY)
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: OTEL_INSTRUMENTATION_COMMON_V3_PREVIEW
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
