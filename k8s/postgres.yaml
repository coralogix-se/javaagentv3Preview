apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: otel-java-v3
type: Opaque
stringData:
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orders
  POSTGRES_DB: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-java-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orders", "-d", "orders"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-java-v3
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
